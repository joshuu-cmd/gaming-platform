services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaming_platform
      POSTGRES_USER: gaming_platform
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaming_platform -d gaming_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
